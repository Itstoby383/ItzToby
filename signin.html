<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1329">
<title>Sign up | itztoby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: #0b1329;
  color: #f1f5f9;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
}
header {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  padding: 2rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand { color: #fff; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; text-decoration: none; }
.nav-btn {
  padding: 0.6rem 1.25rem;
  border-radius: 100px;
  background: #fff;
  color: #0b1329;
  font-size: 0.9rem;
  font-weight: 600;
  text-decoration: none;
}
.nav-btn:hover { background: #e2e8f0; }
main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem; }
.container {
  width: 100%;
  max-width: 560px;
  padding: 3rem;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.03);
}
h1 { margin-bottom: 0.5rem; color: #fff; font-size: 2.25rem; font-weight: 700; letter-spacing: -0.03em; }
.sub { margin-bottom: 2rem; color: #94a3b8; font-size: 1rem; line-height: 1.6; }
.signin-widget { display: flex; justify-content: center; min-height: 48px; }
@media (max-width: 600px) {
  header { padding: 1.5rem 1.25rem; }
  main { padding: 1.25rem; }
  .container { padding: 2rem 1.25rem; }
  h1 { font-size: 1.9rem; }
}
</style>
</head>
<body>
<header>
  <a href="index.html" class="brand">itztoby</a>
  <a href="index.html" class="nav-btn">Home</a>
</header>
<main>
  <section class="container" aria-labelledby="signup-title">
    <h1 id="signup-title">Sign up or sign in</h1>
    <p class="sub">Create an account or sign in to continue.</p>
    <div class="signin-widget">
      <script src="https://api.itisnow.net/button.js" data-app-id="app_XnOUnf_n2Js1" data-onlogin="onItIsNowLogin"></script>
    </div>
  </section>
</main>
<script>
function onItIsNowLogin(user, token) {
  console.log('Signed in as', user.username);
}
</script>
</body>
</html>
