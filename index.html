<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>itztoby | Digital Corner</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*, *::before, *::after {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
background-color: #0b1329;
color: #f1f5f9;
min-height: 100vh;
display: flex;
flex-direction: column;
}

header {
width: 100%;
max-width: 1000px;
margin: 0 auto;
padding: 2rem 1.5rem;
display: flex;
justify-content: space-between;
align-items: center;
}

.brand {
font-size: 1.5rem;
font-weight: 700;
color: #ffffff;
text-decoration: none;
letter-spacing: -0.02em;
}

.nav-btn {
background: #ffffff;
color: #0b1329;
padding: 0.6rem 1.25rem;
border-radius: 100px;
font-weight: 600;
font-size: 0.9rem;
text-decoration: none;
transition: background 0.2s ease, transform 0.2s ease;
}

.nav-btn:hover {
background: #e2e8f0;
transform: translateY(-1px);
}

main {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
padding: 2rem 1.5rem;
}

.container {
width: 100%;
max-width: 900px;
display: grid;
grid-template-columns: 1fr 1fr;
gap: 3rem;
align-items: center;
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.08);
border-radius: 24px;
padding: 3rem;
}

.hero-text {
display: flex;
flex-direction: column;
align-items: flex-start;
}

h1 {
font-size: 3rem;
font-weight: 700;
letter-spacing: -0.03em;
color: #ffffff;
margin-bottom: 0.5rem;
}

.sub {
color: #94a3b8;
font-size: 1.25rem;
margin-bottom: 2rem;
}

.status-text {
display: inline-flex;
align-items: center;
gap: 0.6rem;
color: #fca5a5;
font-weight: 600;
font-size: 1rem;
background: rgba(239, 68, 68, 0.1);
border: 1px solid rgba(239, 68, 68, 0.25);
padding: 0.85rem 1.5rem;
border-radius: 12px;
}

.status-dot {
width: 8px;
height: 8px;
border-radius: 50%;
background: #ef4444;
flex-shrink: 0;
}

.apps {
display: flex;
flex-direction: column;
gap: 1rem;
}

.orca-card {
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.08);
border-radius: 16px;
padding: 1.25rem;
text-decoration: none;
color: #ffffff;
display: flex;
flex-direction: column;
gap: 1rem;
transition: border-color 0.2s ease, transform 0.2s ease;
}

a.orca-card:hover {
border-color: rgba(255, 255, 255, 0.2);
transform: translateY(-3px);
}

.orca-card.disabled {
opacity: 0.55;
cursor: not-allowed;
}

.orca-img-wrapper {
width: 100%;
height: 140px;
border-radius: 12px;
overflow: hidden;
background: #060b18;
}

.orca-img-wrapper img {
width: 100%;
height: 100%;
object-fit: cover;
}

.games-art {
display: flex;
align-items: center;
justify-content: center;
background: linear-gradient(135deg, #2563eb, #7c3aed);
font-size: 1.4rem;
font-weight: 700;
letter-spacing: -0.02em;
}

.orca-title {
font-size: 1.1rem;
font-weight: 600;
display: flex;
align-items: center;
justify-content: space-between;
}

.tag {
font-size: 0.75rem;
font-weight: 600;
color: #fca5a5;
}

@media (max-width: 768px) {
.container {
grid-template-columns: 1fr;
padding: 2rem;
gap: 2rem;
}

h1 {
font-size: 2.25rem;
}
}
</style>
</head>
<body>

<header>
<a href="#" class="brand">itztoby</a>
<a href="https://games.itztoby.co.uk/" class="nav-btn">Play Games</a>
</header>

<main>
<div class="container">

<div class="hero-text">
<h1>itztoby</h1>
<p class="sub">your digital corner</p>

<p class="status-text"><span class="status-dot"></span>Orca is out of service atm</p>
</div>

<div class="apps">

<div class="orca-card disabled" aria-disabled="true">
<div class="orca-img-wrapper">
<img src="orca.png" alt="Orca">
</div>
<div class="orca-title">
<span>Orca</span>
<span class="tag">Out of service</span>
</div>
</div>

<a href="https://games.itztoby.co.uk/" class="orca-card" rel="noopener noreferrer">
<div class="orca-img-wrapper games-art">toabstergames</div>
<div class="orca-title">
<span>toabstergames</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
</div>
</a>

</div>

</div>
</main>

</body>
</html>
