<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1329">
<title>itztoby | Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background-color: #0b1329;
  color: #f1f5f9;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
}
.login-card {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.75rem;
  padding: 3rem 2.5rem;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px;
  background: rgba(255,255,255,0.03);
  text-align: center;
}
.brand-mark {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #fff;
}
.login-heading { display: flex; flex-direction: column; gap: 0.5rem; }
.login-heading h1 {
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: #fff;
}
.login-heading p { color: #94a3b8; font-size: 0.95rem; }
.divider { width: 100%; height: 1px; background: rgba(255,255,255,0.07); }
.error { color: #fca5a5; font-size: 0.85rem; min-height: 1.2em; }
</style>
</head>
<body>

<!-- If already signed in, skip straight to main before anything renders -->
<script>
  (function() {
    // Check our own key first
    try {
      var s = localStorage.getItem('orca_user');
      if (s && JSON.parse(s).id) { window.location.replace('main.html'); return; }
    } catch(e) {}
    // Also check ItIsNow's native key as fallback
    try {
      var k = localStorage.getItem('itisnow_session_app_XnOUnf_n2Js1');
      if (k && JSON.parse(k).token) { window.location.replace('main.html'); return; }
    } catch(e) {}
  })();
</script>

<div class="login-card">
  <div class="brand-mark">itztoby</div>
  <div class="login-heading">
    <h1>Welcome back</h1>
    <p>Sign in to continue.</p>
  </div>
  <div class="divider"></div>

  <script src="https://api.itisnow.net/button.js"
          data-app-id="app_XnOUnf_n2Js1"
          data-button="true"></script>

  <div class="cf-turnstile" id="turnstile-widget"
       data-sitekey="0x4AAAAAAGPjfmnPHGBPTbSH"
       data-theme="dark"
       data-size="flexible"></div>

  <p class="error" id="error-msg"></p>
</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<script>
  window.addEventListener('itisnow:login', function(e) {
    var user  = e.detail.user;
    var token = e.detail.token;

    // Block if CAPTCHA not completed
    var captchaOk = false;
    try { captchaOk = !!(window.turnstile && window.turnstile.getResponse()); } catch(err) {}
    if (!captchaOk) {
      document.getElementById('error-msg').textContent = 'Please complete the CAPTCHA first.';
      return;
    }

    try {
      localStorage.setItem('orca_user', JSON.stringify({
        id: user.id,
        username: user.username,
        email: user.email,
        token: token
      }));
    } catch(err) {
      document.getElementById('error-msg').textContent =
        'Could not save your session. Your browser may be blocking storage.';
      return;
    }

    // Record this user in the shared app-level users collection (no bearer = app-scoped)
    fetch('https://api.itisnow.net/api/data/users/' + encodeURIComponent(user.id), {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-App-Id': 'app_XnOUnf_n2Js1'
      },
      body: JSON.stringify({
        id: user.id,
        username: user.username,
        email: user.email,
        lastSeen: new Date().toISOString()
      })
    }).catch(function() {}).finally(function() {
      window.location.replace('main.html');
    });
  });
</script>

</body>
</html>
