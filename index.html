<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1329">
<title>itztoby | Digital Corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background-color: #0b1329;
  color: #f1f5f9;
  min-height: 100vh;
}

.view { display: none; }
.view.active { display: flex; }

/* ── SIGN-IN VIEW ── */
#auth-view {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem 1.5rem;
}

.login-card {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.75rem;
  padding: 3rem 2.5rem;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px;
  background: rgba(255,255,255,0.03);
  text-align: center;
}

.brand-mark {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #fff;
}

.login-heading { display: flex; flex-direction: column; gap: 0.5rem; }
.login-heading h1 {
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: #fff;
}
.login-heading p { color: #94a3b8; font-size: 0.95rem; }

.divider { width: 100%; height: 1px; background: rgba(255,255,255,0.07); }

.error { color: #fca5a5; font-size: 0.85rem; min-height: 1.2em; }

/* ── MAIN VIEW ── */
#main-view {
  flex-direction: column;
  min-height: 100vh;
}

header {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  padding: 1.75rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  color: #fff;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  text-decoration: none;
}

.nav-right { display: flex; align-items: center; gap: 0.6rem; }

.nav-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.6rem 1.2rem;
  border-radius: 100px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  color: #e2e8f0;
  font-family: inherit;
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, transform 0.2s;
}
.nav-btn:hover {
  background: rgba(255,255,255,0.11);
  border-color: rgba(255,255,255,0.22);
  transform: translateY(-1px);
}
.nav-btn.logout {
  background: rgba(239,68,68,0.1);
  border-color: rgba(239,68,68,0.25);
  color: #fca5a5;
}
.nav-btn.logout:hover {
  background: rgba(239,68,68,0.18);
  border-color: rgba(239,68,68,0.4);
}

/* Profile modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 1.5rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.modal-backdrop.open { opacity: 1; pointer-events: all; }

.modal {
  width: 100%;
  max-width: 380px;
  background: #111d38;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 2rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  transform: translateY(12px);
  transition: transform 0.2s;
}
.modal-backdrop.open .modal { transform: translateY(0); }

.modal-header { display: flex; align-items: center; justify-content: space-between; }
.modal-header h2 { font-size: 1.1rem; font-weight: 700; color: #fff; }

.close-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.06);
  border: none; border-radius: 50%;
  color: #94a3b8; cursor: pointer; font-size: 1.1rem;
  transition: background 0.2s;
}
.close-btn:hover { background: rgba(255,255,255,0.12); }

.avatar {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.profile-row { display: flex; align-items: center; gap: 1rem; }
.profile-info { display: flex; flex-direction: column; gap: 0.2rem; }
.profile-name { font-weight: 700; color: #fff; font-size: 1rem; }
.profile-email { color: #64748b; font-size: 0.8rem; }
.modal-divider { height: 1px; background: rgba(255,255,255,0.07); }

/* Main content */
main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
}

.container {
  width: 100%;
  max-width: 900px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 3rem;
  padding: 3rem;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px;
  background: rgba(255,255,255,0.03);
}

.hero-text { display: flex; flex-direction: column; align-items: flex-start; }

h1.page-title {
  margin-bottom: 0.5rem;
  color: #fff;
  font-size: 3rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.sub { margin-bottom: 2rem; color: #94a3b8; font-size: 1.25rem; }

.status-text {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.85rem 1.5rem;
  border: 1px solid rgba(239,68,68,0.25);
  border-radius: 12px;
  background: rgba(239,68,68,0.1);
  color: #fca5a5;
  font-size: 1rem;
  font-weight: 600;
}
.status-dot {
  width: 8px; height: 8px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #ef4444;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.apps { display: flex; flex-direction: column; gap: 1rem; }

.orca-card {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding: 1.25rem;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  background: rgba(255,255,255,0.03);
  color: #fff;
  text-decoration: none;
  transition: border-color 0.2s, transform 0.2s;
}
a.orca-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.2); }
.orca-card.disabled { opacity: 0.55; cursor: not-allowed; }

.orca-img-wrapper {
  width: 100%; height: 140px;
  overflow: hidden;
  border-radius: 12px;
  background: #060b18;
}
.orca-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }

.games-art { display: flex; align-items: center; justify-content: center; background: #101a33; }
.games-art img { width: 100%; height: 100%; object-fit: contain; }

.orca-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 1.1rem;
  font-weight: 600;
}
.tag { color: #fca5a5; font-size: 0.75rem; font-weight: 600; }

@media (max-width: 768px) {
  .container { grid-template-columns: 1fr; gap: 2rem; padding: 2rem; }
  h1.page-title { font-size: 2.25rem; }
}
</style>
</head>
<body>

<!-- ══ SIGN-IN VIEW ══════════════════════════════════════════ -->
<div id="auth-view" class="view">
  <div class="login-card">
    <div class="brand-mark">itztoby</div>
    <div class="login-heading">
      <h1>Welcome back</h1>
      <p>Sign in to continue.</p>
    </div>
    <div class="divider"></div>
    <!-- ItIsNow button renders right here, inside the card -->
    <script src="https://api.itisnow.net/button.js"
            data-app-id="app_XnOUnf_n2Js1"
            data-onlogin="onItIsNowLogin"></script>
    <p class="error" id="error-msg"></p>
  </div>
</div>

<!-- ══ MAIN VIEW ═════════════════════════════════════════════ -->
<div id="main-view" class="view">
  <header>
    <a href="index.html" class="brand">itztoby</a>
    <div class="nav-right">
      <button type="button" class="nav-btn" id="profile-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        Profile
      </button>
      <button type="button" class="nav-btn logout" id="logout-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="hero-text">
        <h1 class="page-title">itztoby</h1>
        <p class="sub">your digital corner</p>
        <p class="status-text" role="status">
          <span class="status-dot"></span>Orca is out of service atm
        </p>
      </div>
      <div class="apps">
        <div class="orca-card disabled" aria-disabled="true">
          <div class="orca-img-wrapper"><img src="orca.png" alt="Orca"></div>
          <div class="orca-title">
            <span>Orca</span>
            <span class="tag">Out of service</span>
          </div>
        </div>
        <a href="https://games.itztoby.co.uk/" class="orca-card" rel="noopener noreferrer">
          <div class="orca-img-wrapper games-art"><img src="tobgam.png" alt="Tobzter Games"></div>
          <div class="orca-title">
            <span>Tobzter Games</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </div>
        </a>
      </div>
    </div>
  </main>
</div>

<!-- ══ PROFILE MODAL ═════════════════════════════════════════ -->
<div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true" aria-label="Profile">
  <div class="modal">
    <div class="modal-header">
      <h2>Your Profile</h2>
      <button class="close-btn" id="close-modal" aria-label="Close">✕</button>
    </div>
    <div class="profile-row">
      <div class="avatar" id="avatar-initials">?</div>
      <div class="profile-info">
        <span class="profile-name" id="modal-username">—</span>
        <span class="profile-email" id="modal-email">—</span>
      </div>
    </div>
    <div class="modal-divider"></div>
    <button type="button" class="nav-btn logout" id="modal-logout-btn" style="width:100%;justify-content:center;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign out
    </button>
  </div>
</div>

<script>
  /* ── helpers ── */
  function getInitials(name) {
    if (!name) return '?';
    return name.trim().split(/\s+/).map(function(w){ return w[0]; }).join('').toUpperCase().slice(0,2);
  }

  function signOut() {
    try { localStorage.removeItem('orca_user'); } catch(e) {}
    window.__orcaUser = null;
    closeModal();
    showAuthView();
  }

  function openModal() { document.getElementById('modal-backdrop').classList.add('open'); }
  function closeModal() { document.getElementById('modal-backdrop').classList.remove('open'); }

  function showMainView() {
    var user = window.__orcaUser;
    var name  = (user && (user.username || user.email)) || 'user';
    var email = (user && user.email) || '';

    document.getElementById('modal-username').textContent = name;
    document.getElementById('modal-email').textContent    = email;
    document.getElementById('avatar-initials').textContent = getInitials(name);

    document.getElementById('auth-view').classList.remove('active');
    document.getElementById('main-view').classList.add('active');
  }

  function showAuthView() {
    document.getElementById('main-view').classList.remove('active');
    document.getElementById('auth-view').classList.add('active');
  }

  /* ── ItIsNow callback ── */
  function onItIsNowLogin(user, token) {
    try {
      localStorage.setItem('orca_user', JSON.stringify({
        id: user.id,
        username: user.username,
        email: user.email,
        token: token
      }));
    } catch(e) {
      document.getElementById('error-msg').textContent =
        'Could not save your session. Your browser may be blocking storage.';
      return;
    }
    window.__orcaUser = user;
    showMainView();
  }

  /* ── events ── */
  document.getElementById('logout-btn').addEventListener('click', signOut);
  document.getElementById('modal-logout-btn').addEventListener('click', signOut);
  document.getElementById('profile-btn').addEventListener('click', openModal);
  document.getElementById('close-modal').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', function(e){
    if (e.target === this) closeModal();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeModal();
  });

  /* ── boot: check saved session ── */
  var raw = null;
  try { raw = localStorage.getItem('orca_user'); } catch(e) {}
  if (raw) {
    try {
      window.__orcaUser = JSON.parse(raw);
      showMainView();
    } catch(e) {
      window.__orcaUser = null;
      showAuthView();
    }
  } else {
    showAuthView();
  }
</script>

</body>
</html>
