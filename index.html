<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>itztoby | Digital Corner</title>

<!-- Modern Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* Reset & CSS Variables */
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

:root {
--bg-gradient: radial-gradient(circle at 50% 0%, #0d2137 0%, #050b14 100%);
--card-bg: rgba(13, 27, 46, 0.65);
--card-border: rgba(255, 255, 255, 0.08);
--accent-blue: #00d2ff;
--accent-gradient: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%);
--text-main: #f0f6fc;
--text-sub: #8b949e;
}

body {
font-family: 'Inter', system-ui, -apple-system, sans-serif;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
background: var(--bg-gradient);
color: var(--text-main);
padding: 1.5rem;
background-attachment: fixed;
}

/* Main Container Card */
.container {
width: 100%;
max-width: 880px;
display: grid;
grid-template-columns: 1fr 1fr;
gap: 2.5rem;
align-items: center;
background: var(--card-bg);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border: 1px solid var(--card-border);
border-radius: 24px;
padding: 3rem;
box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
0 0 40px rgba(0, 210, 255, 0.05);
}

/* Hero Content (Left Side) */
.hero-content {
display: flex;
flex-direction: column;
align-items: flex-start;
text-align: left;
}

.badge {
display: inline-flex;
align-items: center;
gap: 0.5rem;
font-size: 0.8rem;
font-weight: 600;
letter-spacing: 0.05em;
text-transform: uppercase;
color: var(--accent-blue);
background: rgba(0, 210, 255, 0.1);
border: 1px solid rgba(0, 210, 255, 0.2);
padding: 0.35rem 0.85rem;
border-radius: 100px;
margin-bottom: 1.25rem;
}

h1 {
font-size: 3rem;
font-weight: 700;
letter-spacing: -0.03em;
color: #ffffff;
line-height: 1.1;
margin-bottom: 0.5rem;
}

.sub {
color: var(--text-sub);
font-size: 1.1rem;
margin-bottom: 2rem;
font-weight: 400;
}

.shop-btn {
display: inline-flex;
align-items: center;
justify-content: center;
background: var(--accent-gradient);
color: #ffffff;
font-weight: 600;
font-size: 1.05rem;
padding: 0.9rem 1.8rem;
border-radius: 12px;
text-decoration: none;
box-shadow: 0 4px 20px rgba(0, 114, 255, 0.4);
transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.shop-btn:hover {
transform: translateY(-2px);
box-shadow: 0 8px 25px rgba(0, 210, 255, 0.5);
filter: brightness(1.1);
}

.shop-btn:focus-visible {
outline: 3px solid var(--accent-blue);
outline-offset: 3px;
}

/* Orca Feature Side Card (Right Side) */
.orca-card {
position: relative;
background: rgba(255, 255, 255, 0.03);
border: 1px solid var(--card-border);
border-radius: 20px;
padding: 1.25rem;
display: flex;
flex-direction: column;
align-items: center;
text-align: center;
transition: all 0.3s ease;
text-decoration: none;
color: inherit;
}

.orca-card:hover {
border-color: rgba(0, 210, 255, 0.3);
transform: translateY(-4px);
background: rgba(255, 255, 255, 0.05);
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

.orca-img-wrapper {
width: 100%;
height: 200px;
border-radius: 14px;
overflow: hidden;
background: #050b14;
margin-bottom: 1rem;
display: flex;
align-items: center;
justify-content: center;
border: 1px solid rgba(255, 255, 255, 0.05);
}

.orca-img-wrapper img {
width: 100%;
height: 100%;
object-fit: cover;
transition: transform 0.5s ease;
}

.orca-card:hover .orca-img-wrapper img {
transform: scale(1.05);
}

.orca-card-title {
font-size: 1.2rem;
font-weight: 600;
color: #ffffff;
display: flex;
align-items: center;
gap: 0.5rem;
}

.orca-card-title span {
color: var(--accent-blue);
transition: transform 0.2s ease;
}

.orca-card:hover .orca-card-title span {
transform: translateX(3px);
}

/* Responsive Layout */
@media (max-width: 768px) {
.container {
grid-template-columns: 1fr;
padding: 2rem 1.5rem;
gap: 2rem;
}

.hero-content {
align-items: center;
text-align: center;
}

h1 {
font-size: 2.25rem;
}
}
</style>
</head>
<body>

<div class="container">
<!-- Main Content -->
<main class="hero-content">
<div class="badge">Welcome</div>
<h1>itztoby</h1>
<p class="sub">your digital corner</p>

<a href="https://ai.itztoby.co.uk/" class="shop-btn" rel="noopener noreferrer">
Easy Free AI helper
</a>
</main>

<!-- Side Card for Orca -->
<a href="https://ai.itztoby.co.uk/" class="orca-card" rel="noopener noreferrer">
<div class="orca-img-wrapper">
<img src="orca.png" alt="Try Orca">
</div>
<div class="orca-card-title">
Try Orca <span>&rarr;</span>
</div>
</a>
</div>

</body>
</html>
