<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>itztoby | Digital Corner</title>

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* Reset */
*, *::before, *::after {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
background-color: #0b1329;
color: #f1f5f9;
min-height: 100vh;
display: flex;
flex-direction: column;
}

/* Header Navigation */
header {
width: 100%;
max-width: 1000px;
margin: 0 auto;
padding: 2rem 1.5rem;
display: flex;
justify-content: space-between;
align-items: center;
}

.brand {
font-size: 1.5rem;
font-weight: 700;
color: #ffffff;
text-decoration: none;
letter-spacing: -0.02em;
}

.nav-btn {
background: #ffffff;
color: #0b1329;
padding: 0.6rem 1.25rem;
border-radius: 100px;
font-weight: 600;
font-size: 0.9rem;
text-decoration: none;
transition: background 0.2s ease, transform 0.2s ease;
}

.nav-btn:hover {
background: #e2e8f0;
transform: translateY(-1px);
}

/* Main Container */
main {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
padding: 2rem 1.5rem;
}

.container {
width: 100%;
max-width: 900px;
display: grid;
grid-template-columns: 1fr 1fr;
gap: 3rem;
align-items: center;
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.08);
border-radius: 24px;
padding: 3rem;
}

/* Hero Text (Left Column) */
.hero-text {
display: flex;
flex-direction: column;
align-items: flex-start;
}

h1 {
font-size: 3rem;
font-weight: 700;
letter-spacing: -0.03em;
color: #ffffff;
margin-bottom: 0.5rem;
}

.sub {
color: #94a3b8;
font-size: 1.25rem;
margin-bottom: 2rem;
}

.shop-btn {
display: inline-flex;
align-items: center;
gap: 0.5rem;
background: #2563eb;
color: #ffffff;
font-weight: 600;
font-size: 1rem;
padding: 0.85rem 1.75rem;
border-radius: 12px;
text-decoration: none;
transition: background 0.2s ease, transform 0.2s ease;
}

.shop-btn:hover {
background: #1d4ed8;
transform: translateY(-2px);
}

/* Orca Side Card (Right Column) */
.orca-card {
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.08);
border-radius: 16px;
padding: 1.25rem;
text-decoration: none;
color: #ffffff;
display: flex;
flex-direction: column;
gap: 1rem;
transition: border-color 0.2s ease, transform 0.2s ease;
}

.orca-card:hover {
border-color: rgba(255, 255, 255, 0.2);
transform: translateY(-3px);
}

.orca-img-wrapper {
width: 100%;
height: 200px;
border-radius: 12px;
overflow: hidden;
background: #060b18;
}

.orca-img-wrapper img {
width: 100%;
height: 100%;
object-fit: cover;
}

.orca-title {
font-size: 1.1rem;
font-weight: 600;
display: flex;
align-items: center;
justify-content: space-between;
}

/* Responsive Layout */
@media (max-width: 768px) {
.container {
grid-template-columns: 1fr;
padding: 2rem;
gap: 2rem;
}

h1 {
font-size: 2.25rem;
}
}
</style>
</head>
<body>

<!-- Navigation Bar -->
<header>
<a href="#" class="brand">itztoby</a>
<a href="https://orca.itztoby.co.uk/" class="nav-btn">Launch Helper</a>
</header>

<!-- Hero Content -->
<main>
<div class="container">

<!-- Left Side -->
<div class="hero-text">
<h1>itztoby</h1>
<p class="sub">your digital corner</p>

<a href="https://orca.itztoby.co.uk/" class="shop-btn" rel="noopener noreferrer">
Easy Free Helper
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
</a>
</div>

<!-- Right Side: Orca Card -->
<a href="https://orca.itztoby.co.uk/" class="orca-card" rel="noopener noreferrer">
<div class="orca-img-wrapper">
<img src="orca.png" alt="Try Orca">
</div>
<div class="orca-title">
<span>Try Orca</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
</div>
</a>

</div>
</main>

</body>
</html>
