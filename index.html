<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1329">
<title>itztoby | Digital Corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background-color: #0b1329;
  color: #f1f5f9;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  padding: 2rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand {
  color: #fff;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  text-decoration: none;
}
.nav-btn {
  padding: 0.6rem 1.25rem;
  border-radius: 100px;
  background: #fff;
  color: #0b1329;
  font-size: 0.9rem;
  font-weight: 600;
  text-decoration: none;
  transition: background 0.2s ease, transform 0.2s ease;
}
.nav-btn:hover { background: #e2e8f0; transform: translateY(-1px); }
main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem;
}
.container {
  width: 100%;
  max-width: 900px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 3rem;
  padding: 3rem;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.03);
}
.hero-text { display: flex; flex-direction: column; align-items: flex-start; }
h1 {
  margin-bottom: 0.5rem;
  color: #fff;
  font-size: 3rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}
.sub { margin-bottom: 2rem; color: #94a3b8; font-size: 1.25rem; }
.status-text {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.85rem 1.5rem;
  border: 1px solid rgba(239, 68, 68, 0.25);
  border-radius: 12px;
  background: rgba(239, 68, 68, 0.1);
  color: #fca5a5;
  font-size: 1rem;
  font-weight: 600;
}
.status-dot { width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: #ef4444; }
.apps { display: flex; flex-direction: column; gap: 1rem; }
.orca-card {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding: 1.25rem;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.03);
  color: #fff;
  text-decoration: none;
  transition: border-color 0.2s ease, transform 0.2s ease;
}
a.orca-card:hover { transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.2); }
.orca-card.disabled { opacity: 0.55; cursor: not-allowed; }
.orca-img-wrapper { width: 100%; height: 140px; overflow: hidden; border-radius: 12px; background: #060b18; }
.orca-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
.games-art {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #101a33;
}
.games-art img { width: 100%; height: 100%; object-fit: contain; }
.orca-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 1.1rem;
  font-weight: 600;
}
.tag { color: #fca5a5; font-size: 0.75rem; font-weight: 600; }
@media (max-width: 768px) {
  .container { grid-template-columns: 1fr; gap: 2rem; padding: 2rem; }
  h1 { font-size: 2.25rem; }
}
</style>
</head>
<body>
<header>
  <a href="index.html" class="brand">itztoby</a>
  <a href="signin.html" class="nav-btn">Sign up</a>
</header>
<main>
  <div class="container">
    <div class="hero-text">
      <h1>itztoby</h1>
      <p class="sub">your digital corner</p>
      <p class="status-text" role="status"><span class="status-dot"></span>Orca is out of service atm</p>
    </div>
    <div class="apps">
      <div class="orca-card disabled" aria-disabled="true">
        <div class="orca-img-wrapper"><img src="orca.png" alt="Orca"></div>
        <div class="orca-title"><span>Orca</span><span class="tag">Out of service</span></div>
      </div>
      <a href="https://games.itztoby.co.uk/" class="orca-card" rel="noopener noreferrer">
        <div class="orca-img-wrapper games-art"><img src="tobgam.png" alt="Tobzter Games"></div>
        <div class="orca-title">
          <span>Tobzter Games</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
      </a>
    </div>
  </div>
</main>
</body>
</html>
