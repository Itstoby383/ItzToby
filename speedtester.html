<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070d1a">
<title>Speed Test | itztoby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #070d1a;
  --bg2: #0c1526;
  --border: rgba(255,255,255,0.07);
  --text: #e8edf5;
  --muted: #64748b;
  --cyan: #00e0ff;
  --cyan-dim: rgba(0,224,255,0.1);
  --cyan-border: rgba(0,224,255,0.2);
}

html, body {
  height: 100%;
}

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── NAV ── */
nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(7,13,26,0.9);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  max-width: 1060px; margin: 0 auto;
  padding: 0.9rem 1.5rem;
  display: flex; justify-content: space-between; align-items: center;
}
.brand { color: #fff; font-size: 1.15rem; font-weight: 800; letter-spacing: -0.03em; text-decoration: none; }
.brand span { color: var(--cyan); }
.nav-back {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.5rem 1rem; border-radius: 6px;
  border: 1px solid var(--border); background: transparent;
  color: #94a3b8; font-family: inherit; font-size: 0.82rem; font-weight: 500;
  text-decoration: none; transition: color 0.15s, border-color 0.15s;
}
.nav-back:hover { color: #fff; border-color: rgba(255,255,255,0.2); }

/* ── MAIN ── */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3rem 1.5rem;
  gap: 2.5rem;
}

/* ── GAUGE ── */
.gauge-wrap {
  position: relative;
  width: 280px;
  height: 240px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.gauge-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* Track arc */
.gauge-track {
  fill: none;
  stroke: rgba(255,255,255,0.06);
  stroke-width: 14;
  stroke-linecap: round;
  /* r=110, 270° arc: 2π×110×0.75 ≈ 518 */
  stroke-dasharray: 518 10000;
  transform-origin: 140px 130px;
  transform: rotate(135deg);
}
/* Fill arc */
.gauge-fill {
  fill: none;
  stroke: var(--cyan);
  stroke-width: 14;
  stroke-linecap: round;
  stroke-dasharray: 518 10000;
  stroke-dashoffset: 518;
  transform-origin: 140px 130px;
  transform: rotate(135deg);
  transition: stroke-dashoffset 0.15s linear;
  filter: drop-shadow(0 0 8px rgba(0,224,255,0.5));
}
/* Glow outer ring */
.gauge-glow {
  fill: none;
  stroke: var(--cyan);
  stroke-width: 2;
  opacity: 0;
  stroke-dasharray: 518 10000;
  stroke-dashoffset: 518;
  transform-origin: 140px 130px;
  transform: rotate(135deg);
  transition: stroke-dashoffset 0.15s linear, opacity 0.3s;
  filter: blur(4px);
}

.gauge-center {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: -20px;
}
.gauge-number {
  font-size: 3.5rem;
  font-weight: 900;
  letter-spacing: -0.04em;
  color: #fff;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  min-width: 140px;
  text-align: center;
}
.gauge-unit {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 0.3rem;
}

/* ── PHASE ── */
.phase-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
}
.phase-label {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--cyan);
  min-height: 1em;
}
.phase-sub {
  font-size: 0.82rem;
  color: var(--muted);
  min-height: 1em;
}

/* ── START BUTTON ── */
.start-btn {
  width: 90px; height: 90px;
  border-radius: 50%;
  border: 2px solid var(--cyan);
  background: var(--cyan-dim);
  color: var(--cyan);
  font-family: inherit;
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
  box-shadow: 0 0 0 0 rgba(0,224,255,0);
}
.start-btn:hover:not(:disabled) {
  background: rgba(0,224,255,0.18);
  transform: scale(1.05);
  box-shadow: 0 0 24px rgba(0,224,255,0.25);
}
.start-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.start-btn.testing {
  animation: btn-pulse 1.5s ease-in-out infinite;
}
@keyframes btn-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,224,255,0.3); }
  50% { box-shadow: 0 0 0 12px rgba(0,224,255,0); }
}

/* ── RESULTS ── */
.results {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  width: 100%;
  max-width: 480px;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: var(--border);
}
.result-card {
  background: var(--bg2);
  padding: 1.25rem 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
}
.result-label {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.result-value {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: #fff;
  font-variant-numeric: tabular-nums;
  transition: color 0.3s;
}
.result-value.ready { color: var(--cyan); }
.result-unit {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ── SERVER INFO ── */
.server-info {
  font-size: 0.75rem;
  color: var(--muted);
  text-align: center;
}
.server-info span { color: #94a3b8; }

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--border);
  padding: 1.2rem 1.5rem;
  text-align: center;
  font-size: 0.72rem;
  color: var(--muted);
}

@media (max-width: 480px) {
  .gauge-number { font-size: 2.75rem; }
  .start-btn { width: 76px; height: 76px; font-size: 0.88rem; }
}
</style>
</head>
<body>

      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>

<main>
  <!-- Gauge -->
  <div class="gauge-wrap">
    <svg class="gauge-svg" viewBox="0 0 280 240">
      <!-- Track -->
      <circle class="gauge-track" cx="140" cy="130" r="110"/>
      <!-- Outer glow -->
      <circle class="gauge-glow" id="gauge-glow" cx="140" cy="130" r="110"/>
      <!-- Fill -->
      <circle class="gauge-fill" id="gauge-fill" cx="140" cy="130" r="110"/>
    </svg>
    <div class="gauge-center">
      <div class="gauge-number" id="gauge-number">—</div>
      <div class="gauge-unit" id="gauge-unit">Mbps</div>
    </div>
  </div>

  <!-- Phase info -->
  <div class="phase-wrap">
    <div class="phase-label" id="phase-label"></div>
    <div class="phase-sub" id="phase-sub">Powered by Cloudflare</div>
  </div>

  <!-- Start button -->
  <button class="start-btn" id="start-btn">GO</button>

  <!-- Results -->
  <div class="results">
    <div class="result-card">
      <div class="result-label">Ping</div>
      <div class="result-value" id="res-ping">—</div>
      <div class="result-unit">ms</div>
    </div>
    <div class="result-card">
      <div class="result-label">Download</div>
      <div class="result-value" id="res-dl">—</div>
      <div class="result-unit">Mbps</div>
    </div>
    <div class="result-card">
      <div class="result-label">Upload</div>
      <div class="result-value" id="res-ul">—</div>
      <div class="result-unit">Mbps</div>
    </div>
  </div>

  <div class="server-info">Test server: <span>Cloudflare (speed.cloudflare.com)</span></div>
</main>

<footer>itztoby speed test &mdash; results may vary based on network conditions</footer>

<script>
  var CF = 'https://speed.cloudflare.com';
  var ARC = 518; // 270° arc length for r=110

  var gaugeEl   = document.getElementById('gauge-fill');
  var glowEl    = document.getElementById('gauge-glow');
  var numEl     = document.getElementById('gauge-number');
  var unitEl    = document.getElementById('gauge-unit');
  var phaseEl   = document.getElementById('phase-label');
  var subEl     = document.getElementById('phase-sub');
  var startBtn  = document.getElementById('start-btn');
  var resPing   = document.getElementById('res-ping');
  var resDl     = document.getElementById('res-dl');
  var resUl     = document.getElementById('res-ul');

  var MAX_MBPS = 300; // full gauge at this speed

  function setGauge(mbps) {
    var clamped = Math.min(mbps, MAX_MBPS);
    var progress = clamped / MAX_MBPS;
    var offset = ARC * (1 - progress);
    gaugeEl.style.strokeDashoffset = offset;
    glowEl.style.strokeDashoffset  = offset;
    glowEl.style.opacity = mbps > 0 ? '0.4' : '0';
    numEl.textContent = mbps >= 10 ? Math.round(mbps) : mbps.toFixed(1);
  }

  function resetGauge() {
    gaugeEl.style.strokeDashoffset = ARC;
    glowEl.style.strokeDashoffset  = ARC;
    glowEl.style.opacity = '0';
    numEl.textContent = '—';
  }

  function sleep(ms) {
    return new Promise(function(r) { setTimeout(r, ms); });
  }

  /* ── Ping ── */
  async function measurePing() {
    phaseEl.textContent = 'Ping';
    subEl.textContent = 'Measuring latency...';
    unitEl.textContent = 'ms';
    var times = [];
    for (var i = 0; i < 5; i++) {
      var t0 = performance.now();
      try {
        await fetch(CF + '/__down?bytes=0&_=' + Date.now(), { cache: 'no-store' });
      } catch(e) {}
      times.push(performance.now() - t0);
      await sleep(150);
    }
    times.sort(function(a,b){ return a-b; });
    var trimmed = times.slice(1, 4);
    var avg = trimmed.reduce(function(a,b){ return a+b; }, 0) / trimmed.length;
    var ping = Math.round(avg);
    setGauge(Math.min(ping * 0.5, MAX_MBPS)); // visual only
    resPing.textContent = ping;
    resPing.classList.add('ready');
    unitEl.textContent = 'Mbps';
    return ping;
  }

  /* ── Download ── */
  async function measureDownload() {
    phaseEl.textContent = 'Download';
    subEl.textContent = 'Testing download speed...';
    resetGauge();
    unitEl.textContent = 'Mbps';

    // Warmup
    try { await fetch(CF + '/__down?bytes=102400&_=' + Date.now(), { cache: 'no-store' }); } catch(e) {}

    var url = CF + '/__down?bytes=25000000&_=' + Date.now();
    var t0 = performance.now();
    var response;
    try {
      response = await fetch(url, { cache: 'no-store' });
    } catch(e) { return 0; }

    var reader = response.body.getReader();
    var bytes = 0;
    var peak = 0;

    while (true) {
      var result;
      try { result = await reader.read(); } catch(e) { break; }
      if (result.done) break;
      bytes += result.value.length;
      var secs = (performance.now() - t0) / 1000;
      if (secs > 0.5) { // skip first half second (connection overhead)
        var mbps = (bytes * 8) / secs / 1e6;
        if (mbps > peak) peak = mbps;
        setGauge(mbps);
      }
    }

    resDl.textContent = peak >= 10 ? Math.round(peak) : peak.toFixed(1);
    resDl.classList.add('ready');
    return peak;
  }

  /* ── Upload ── */
  async function measureUpload() {
    phaseEl.textContent = 'Upload';
    subEl.textContent = 'Testing upload speed...';
    resetGauge();
    unitEl.textContent = 'Mbps';

    var size = 10 * 1024 * 1024; // 10MB
    var data = new Uint8Array(size);
    // Randomise a chunk to avoid compression
    if (crypto && crypto.getRandomValues) {
      crypto.getRandomValues(data.subarray(0, Math.min(65536, size)));
    }

    return new Promise(function(resolve) {
      var t0 = performance.now();
      var xhr = new XMLHttpRequest();
      xhr.open('POST', CF + '/__up', true);

      xhr.upload.onprogress = function(e) {
        if (!e.lengthComputable) return;
        var secs = (performance.now() - t0) / 1000;
        if (secs < 0.3) return;
        var mbps = (e.loaded * 8) / secs / 1e6;
        setGauge(mbps);
      };

      xhr.onload = xhr.onerror = xhr.ontimeout = function() {
        var secs = (performance.now() - t0) / 1000;
        var mbps = secs > 0 ? (size * 8) / secs / 1e6 : 0;
        resUl.textContent = mbps >= 10 ? Math.round(mbps) : mbps.toFixed(1);
        resUl.classList.add('ready');
        resolve(mbps);
      };

      xhr.timeout = 20000;
      xhr.send(data.buffer);
    });
  }

  /* ── Run test ── */
  async function runTest() {
    startBtn.disabled = true;
    startBtn.textContent = '...';
    startBtn.classList.add('testing');

    // Reset
    resPing.textContent = '—'; resPing.classList.remove('ready');
    resDl.textContent   = '—'; resDl.classList.remove('ready');
    resUl.textContent   = '—'; resUl.classList.remove('ready');
    resetGauge();

    try {
      await measurePing();
      await sleep(400);
      await measureDownload();
      await sleep(400);
      await measureUpload();
    } catch(err) {
      console.error(err);
    }

    phaseEl.textContent = 'Done';
    subEl.textContent = 'Test complete';
    startBtn.disabled = false;
    startBtn.textContent = 'GO';
    startBtn.classList.remove('testing');
    resetGauge();
    numEl.textContent = '—';
  }

  startBtn.addEventListener('click', runTest);
</script>

</body>
