<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #070d1a;
  --bg2: #0c1526;
  --border: rgba(255,255,255,0.07);
  --text: #e8edf5;
  --muted: #64748b;
  --cyan: #00e0ff;
  --cyan-dim: rgba(0,224,255,0.08);
  --cyan-border: rgba(0,224,255,0.2);
}

html, body { height: 100%; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── NAV ── */
nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(7,13,26,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  max-width: 1060px; margin: 0 auto;
  padding: 0.9rem 1.5rem;
  display: flex; justify-content: space-between; align-items: center;
}
.brand { color: #fff; font-size: 1.15rem; font-weight: 800; letter-spacing: -0.03em; text-decoration: none; }
.brand span { color: var(--cyan); }
.nav-back {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.5rem 1rem; border-radius: 6px;
  border: 1px solid var(--border); background: transparent;
  color: #94a3b8; font-family: inherit; font-size: 0.82rem; font-weight: 500;
  text-decoration: none; transition: color 0.15s, border-color 0.15s;
}
.nav-back:hover { color: #fff; border-color: rgba(255,255,255,0.2); }

/* ── MAIN ── */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1.5rem 3rem;
  gap: 0;
}

/* ── SERVER INFO ── */
.server-row {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  margin-bottom: 1.5rem;
}
.server-pill {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.4rem 0.9rem;
  border: 1px solid var(--border);
  border-radius: 100px;
  background: var(--bg2);
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--muted);
}
.server-pill span { color: #94a3b8; }
.server-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); flex-shrink: 0; }

/* ── GAUGE CONTAINER ── */
.gauge-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  width: 100%;
  max-width: 520px;
}

.gauge-wrap {
  position: relative;
  width: 420px;
  height: 360px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.gauge-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* Phase tabs above gauge */
.phase-tabs {
  display: flex;
  gap: 1.5rem;
  margin-bottom: 0.75rem;
}
.phase-tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  opacity: 0.3;
  transition: opacity 0.3s;
}
.phase-tab.active { opacity: 1; }
.phase-tab.done { opacity: 0.6; }
.phase-tab-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted);
  transition: background 0.3s;
}
.phase-tab.active .phase-tab-dot { background: var(--cyan); }
.phase-tab.done .phase-tab-dot { background: #22c55e; }
.phase-tab-label {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.phase-tab.active .phase-tab-label { color: var(--cyan); }
.phase-tab.done .phase-tab-label { color: #22c55e; }

/* Gauge center overlay */
.gauge-center {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: -40px;
  pointer-events: none;
  user-select: none;
}
.gauge-number {
  font-size: 5.5rem;
  font-weight: 900;
  letter-spacing: -0.05em;
  color: #fff;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  min-width: 200px;
  text-align: center;
}
.gauge-unit {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 0.5rem;
}
.gauge-phase-text {
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-top: 0.75rem;
  min-height: 1.2em;
  opacity: 0;
  transition: opacity 0.3s;
}
.gauge-phase-text.visible { opacity: 1; }

/* Go button — sits just below gauge */
.go-btn-wrap {
  margin-top: -24px;
  position: relative;
  z-index: 3;
}
.go-btn {
  width: 80px; height: 80px;
  border-radius: 50%;
  border: 2px solid var(--cyan);
  background: var(--cyan-dim);
  color: var(--cyan);
  font-family: inherit;
  font-size: 1.1rem;
  font-weight: 900;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
  position: relative;
}
.go-btn::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px solid rgba(0,224,255,0.15);
}
.go-btn:hover:not(:disabled) {
  background: rgba(0,224,255,0.16);
  transform: scale(1.06);
  box-shadow: 0 0 32px rgba(0,224,255,0.22);
}
.go-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.go-btn.running { animation: ring-pulse 1.4s ease-in-out infinite; }
@keyframes ring-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,224,255,0.25); }
  50%       { box-shadow: 0 0 0 14px rgba(0,224,255,0); }
}

/* ── RESULTS ── */
.results-row {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 0;
  width: 100%;
  max-width: 520px;
  margin-top: 2.5rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: var(--border);
}
.result-block {
  flex: 1;
  background: var(--bg2);
  padding: 1.5rem 1.25rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.25rem;
}
.result-block + .result-block { border-left: 1px solid var(--border); }
.result-label {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.r-icon { opacity: 0.5; }
.result-value {
  font-size: 2rem;
  font-weight: 900;
  letter-spacing: -0.04em;
  color: #fff;
  font-variant-numeric: tabular-nums;
  transition: color 0.4s;
  line-height: 1.1;
}
.result-value.lit { color: var(--cyan); }
.result-unit {
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--border);
  padding: 1rem 1.5rem;
  text-align: center;
  font-size: 0.72rem;
  color: var(--muted);
}

/* ── RESPONSIVE ── */
@media (max-width: 500px) {
  .gauge-wrap { width: 320px; height: 280px; }
  .gauge-number { font-size: 4rem; }
  .go-btn { width: 68px; height: 68px; font-size: 0.95rem; }
  .result-value { font-size: 1.6rem; }
}
</style>

<main>

  <!-- Server info -->
  <div class="server-row">
    <div class="server-pill">
      <span class="server-dot"></span>
      Server: <span id="server-colo">Cloudflare</span>
    </div>
    <div class="server-pill" id="isp-pill" style="display:none">
      ISP: <span id="server-isp">—</span>
    </div>
  </div>

  <!-- Phase tabs -->
  <div class="phase-tabs">
    <div class="phase-tab" id="tab-ping">
      <div class="phase-tab-dot"></div>
      <div class="phase-tab-label">Ping</div>
    </div>
    <div class="phase-tab" id="tab-dl">
      <div class="phase-tab-dot"></div>
      <div class="phase-tab-label">Download</div>
    </div>
    <div class="phase-tab" id="tab-ul">
      <div class="phase-tab-dot"></div>

  <div class="gauge-section">
    <div class="gauge-wrap">

      <!-- SVG Gauge -->
      <!-- viewBox 420×360, center 210,190, r=160 -->
      <!-- 240° arc: 2π×160×(240/360) ≈ 670.2 -->
      <!-- Rotate start to 150° (bottom-left), sweep 240° to 30° (bottom-right) -->
      <svg class="gauge-svg" viewBox="0 0 420 360">
        <defs>
          <!-- Tick mark group template -->
        </defs>

        <!-- Outer decorative ring -->
        <circle cx="210" cy="190" r="168"
          fill="none"
          stroke="rgba(255,255,255,0.03)"
          stroke-width="1"/>

        <!-- Scale ticks — 24 ticks over 240° arc -->
        <g id="ticks" transform="rotate(150, 210, 190)"></g>

        <!-- Track arc: r=160, 240° -->
        <circle id="gauge-track" cx="210" cy="190" r="160"
          fill="none"
          stroke="rgba(255,255,255,0.07)"
          stroke-width="10"
          stroke-linecap="round"
          stroke-dasharray="670 10000"

        <!-- Glow arc (blurred duplicate) -->
        <circle id="gauge-glow" cx="210" cy="190" r="160"
          fill="none"
          stroke="#00e0ff"
          stroke-width="16"
          stroke-linecap="round"
          stroke-dasharray="670 10000"
          stroke-dashoffset="670"
          transform="rotate(150, 210, 190)"
          opacity="0"
          filter="url(#blur)"/>

        <!-- Fill arc: animates -->
        <circle id="gauge-fill" cx="210" cy="190" r="160"
          fill="none"
          stroke="#00e0ff"
          stroke-width="10"
          stroke-linecap="round"
          stroke-dasharray="670 10000"
          stroke-dashoffset="670"
          transform="rotate(150, 210, 190)"
          style="transition: stroke-dashoffset 0.12s linear; filter: drop-shadow(0 0 6px rgba(0,224,255,0.6));"/>

        <defs>

            <feGaussianBlur stdDeviation="6"/>
          </filter>
        </defs>
      </svg>

      <!-- Center overlay -->
      <div class="gauge-center">
        <div class="gauge-number" id="gauge-number">—</div>
        <div class="gauge-unit" id="gauge-unit">Mbps</div>
        <div class="gauge-phase-text" id="gauge-phase">—</div>
      </div>

    </div>

    <!-- GO button -->
    <div class="go-btn-wrap">

        Ping

<script>
var CF  = 'https://speed.cloudflare.com';
var ARC = 670; // 240° arc for r=160

/* ── DOM refs ── */
var fillEl    = document.getElementById('gauge-fill');
var glowEl    = document.getElementById('gauge-glow');
var numEl     = document.getElementById('gauge-number');
var unitEl    = document.getElementById('gauge-unit');
var phaseEl   = document.getElementById('gauge-phase');
var goBtn     = document.getElementById('go-btn');
var resPing   = document.getElementById('res-ping');
var resDl     = document.getElementById('res-dl');
var resUl     = document.getElementById('res-ul');
var tabPing   = document.getElementById('tab-ping');
var tabDl     = document.getElementById('tab-dl');
var tabUl     = document.getElementById('tab-ul');

/* ── Draw ticks ── */
(function drawTicks() {
  var g = document.getElementById('ticks');
  var cx = 210, cy = 190, r = 160;
  var total = 24;
  var arc = 240;
  for (var i = 0; i <= total; i++) {
    var angle = (arc / total) * i;
    var rad   = angle * Math.PI / 180;
    var isMajor = i % 6 === 0;
    var inner = r - (isMajor ? 16 : 9);
    var outer = r - 2;
    var x1 = cx + inner * Math.cos(rad);
    var y1 = cy + inner * Math.sin(rad);
    var x2 = cx + outer * Math.cos(rad);
    var y2 = cy + outer * Math.sin(rad);
    var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', isMajor ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.08)');
    line.setAttribute('stroke-width', isMajor ? '2' : '1');
    line.setAttribute('stroke-linecap', 'round');
    g.appendChild(line);
  }
})();

/* ── Gauge helpers ── */
// Log scale so lower speeds still show visible movement
function speedToProgress(mbps) {
  if (mbps <= 0) return 0;
  // log scale: 0→0, 1→~0.15, 10→~0.33, 50→~0.55, 100→~0.67, 500→~0.9, 1000→1
  var val = Math.log(mbps + 1) / Math.log(1001);
  return Math.min(val, 1);
}

function setGauge(mbps) {
  var p = speedToProgress(mbps);
  var offset = ARC * (1 - p);
  fillEl.setAttribute('stroke-dashoffset', offset);
  glowEl.setAttribute('stroke-dashoffset', offset);
  glowEl.setAttribute('opacity', mbps > 0 ? '0.25' : '0');

  if (mbps <= 0) {
    numEl.textContent = '—';
  } else if (mbps < 10) {
    numEl.textContent = mbps.toFixed(2);
  } else if (mbps < 100) {
    numEl.textContent = mbps.toFixed(1);
  } else {
    numEl.textContent = Math.round(mbps);
  }
}

function resetGauge() {
  fillEl.setAttribute('stroke-dashoffset', ARC);
  glowEl.setAttribute('stroke-dashoffset', ARC);
  glowEl.setAttribute('opacity', '0');
  numEl.textContent = '—';
}

function setPhaseTab(active) {
  [tabPing, tabDl, tabUl].forEach(function(t) { t.className = 'phase-tab'; });
  if (active === 'ping') { tabPing.classList.add('active'); }
  if (active === 'dl')   { tabDl.classList.add('active'); }
  if (active === 'ul')   { tabUl.classList.add('active'); }
}
function doneTab(tab) { tab.classList.remove('active'); tab.classList.add('done'); }

function setPhaseText(txt) {
  phaseEl.textContent = txt;
  phaseEl.className = 'gauge-phase-text' + (txt ? ' visible' : '');
}

function fmt(mbps) {
  if (!mbps || mbps <= 0) return '—';
  if (mbps < 10)  return mbps.toFixed(2);
  if (mbps < 100) return mbps.toFixed(1);
  return String(Math.round(mbps));
}

function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

/* ── Server info ── */
fetch('https://www.cloudflare.com/cdn-cgi/trace')
  .then(function(r) { return r.text(); })
  .then(function(txt) {
    var colo = (txt.match(/colo=(\w+)/) || [])[1];
    var loc  = (txt.match(/loc=(\w+)/)  || [])[1];
    if (colo) document.getElementById('server-colo').textContent = 'Cloudflare ' + colo + (loc ? ' (' + loc + ')' : '');
  }).catch(function() {});

/* ── Ping ── */
async function measurePing() {
  setPhaseTab('ping');
  setPhaseText('Measuring ping');
  unitEl.textContent = 'ms';
  var times = [];
  for (var i = 0; i < 6; i++) {
    var t0 = performance.now();
    try { await fetch(CF + '/__down?bytes=0&_=' + Date.now(), { cache: 'no-store' }); }
    catch(e) {}
    times.push(performance.now() - t0);
    // Show live ping on gauge
    if (times.length > 1) {
      var cur = times[times.length - 1];
      setGauge(Math.max(0, 150 - cur)); // visual only: invert so low ping = high
      numEl.textContent = Math.round(cur);
    }
    await sleep(180);
  }
  times.sort(function(a, b) { return a - b; });
  var trimmed = times.slice(1, 5);
  var avg = Math.round(trimmed.reduce(function(a, b) { return a + b; }, 0) / trimmed.length);
  resPing.textContent = avg;
  resPing.classList.add('lit');
  doneTab(tabPing);
  unitEl.textContent = 'Mbps';
  return avg;
}

/* ── Download ── */
async function measureDownload() {
  setPhaseTab('dl');
  setPhaseText('Download');
  resetGauge();
  unitEl.textContent = 'Mbps';

  // Warmup request
  try { await fetch(CF + '/__down?bytes=204800&_=' + Date.now(), { cache: 'no-store' }); } catch(e) {}

  var url = CF + '/__down?bytes=35000000&_=' + Date.now();
  var t0 = performance.now();
  var response;
  try { response = await fetch(url, { cache: 'no-store' }); }
  catch(e) { return 0; }

  var reader = response.body.getReader();
  var bytes = 0;
  var peak  = 0;
  var SKIP  = 500; // skip first 500ms (connection overhead)

  while (true) {
    var chunk;
    try { chunk = await reader.read(); } catch(e) { break; }
    if (chunk.done) break;
    bytes += chunk.value.length;
    var elapsed = performance.now() - t0;
    if (elapsed > SKIP) {
      var mbps = (bytes * 8) / (elapsed / 1000) / 1e6;
      if (mbps > peak) peak = mbps;
      setGauge(mbps);
    }
  }

  resDl.textContent = fmt(peak);
  resDl.classList.add('lit');
  doneTab(tabDl);
  return peak;
}

/* ── Upload ── */
async function measureUpload() {
  setPhaseTab('ul');
  setPhaseText('Upload');
  resetGauge();
  unitEl.textContent = 'Mbps';

  var size = 12 * 1024 * 1024; // 12MB
  var buf  = new Uint8Array(size);
  if (window.crypto && crypto.getRandomValues) {
    crypto.getRandomValues(buf.subarray(0, Math.min(65536, size)));
  }

  return new Promise(function(resolve) {
    var t0 = performance.now();
    var peak = 0;
    var xhr = new XMLHttpRequest();
    xhr.open('POST', CF + '/__up', true);

    xhr.upload.onprogress = function(e) {
      if (!e.lengthComputable) return;
      var elapsed = performance.now() - t0;
      if (elapsed < 300) return;
      var mbps = (e.loaded * 8) / (elapsed / 1000) / 1e6;
      if (mbps > peak) peak = mbps;
      setGauge(mbps);
    };

    function finish() {
      var elapsed = (performance.now() - t0) / 1000;
      var mbps = elapsed > 0 ? Math.max(peak, (size * 8) / elapsed / 1e6) : 0;
      resUl.textContent = fmt(mbps);
      resUl.classList.add('lit');
      doneTab(tabUl);
      resolve(mbps);
    }

    xhr.onload = xhr.onerror = xhr.ontimeout = finish;
    xhr.timeout = 25000;
    xhr.send(buf.buffer);
  });
}

/* ── Run ── */
async function runTest() {
  goBtn.disabled = true;
  goBtn.textContent = '•••';
  goBtn.classList.add('running');

  resPing.textContent = '—'; resPing.classList.remove('lit');
  resDl.textContent   = '—'; resDl.classList.remove('lit');
  resUl.textContent   = '—'; resUl.classList.remove('lit');
  [tabPing, tabDl, tabUl].forEach(function(t) { t.className = 'phase-tab'; });
  resetGauge();

  try {
    await measurePing();
    setGauge(0);
    await sleep(500);

    await measureDownload();
    setGauge(0);
    await sleep(500);

    await measureUpload();
  } catch(e) { console.error(e); }

  setPhaseText('Complete');
  resetGauge();
  numEl.textContent = '—';
  goBtn.disabled = false;
  goBtn.textContent = 'GO';
  goBtn.classList.remove('running');
}
